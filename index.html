<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jean Chen's personal page displaying greeting, current date, and real-time clock.">
  <meta name="author" content="Jean Chen">
  <title>Hello | Jean Chen</title>

  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Dynamic Animated Orbs -->
  <div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <main class="card" id="main-card">

      <!-- Profile/Identity Header -->
      <div class="avatar-wrapper">
        <div class="avatar-ring"></div>
        <div class="avatar" id="avatar-icon">
          <!-- Offline Inline SVG Icon (Code symbol with gradient stroke) -->
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="avatar-icon-svg">
            <defs>
              <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-1)" />
                <stop offset="100%" stop-color="var(--accent-2)" />
              </linearGradient>
            </defs>
            <polyline points="16 18 22 12 16 6" stroke="url(#avatar-grad)"></polyline>
            <polyline points="8 6 2 12 8 18" stroke="url(#avatar-grad)"></polyline>
          </svg>
        </div>
      </div>

      <!-- Time of Day Greeting Tag -->
      <div class="greeting-tag" id="greeting-badge">
        <span id="greeting-icon-wrapper" style="display: inline-flex; align-items: center;">
          <!-- Inline dynamic SVG sun/moon will be injected here -->
        </span>
        <span id="greeting-label">Welcome</span>
      </div>

      <!-- Main Headline -->
      <h1 id="main-title">Hello, my name: <span class="name-gradient">Jean Chen</span></h1>

      <p class="intro-text">
        Welcome to my personal page. Below is the live local date and time.
      </p>

      <!-- Live Clock & Date Widget -->
      <div class="clock-widget" id="clock-container">
        <div class="clock-time" id="clock-time-display">
          <span id="time-hour-min">00:00</span>
          <span class="clock-seconds" id="time-sec">:00</span>
          <span class="clock-period" id="time-period">AM</span>
        </div>
        <div class="clock-date" id="clock-date-display">
          Friday, May 29, 2026
        </div>
      </div>

      <!-- Controls & Interactive Elements -->
      <div class="controls">
        <button class="btn" id="theme-toggle" title="Toggle Light/Dark Theme">
          <span id="theme-icon-wrapper" style="display: inline-flex; align-items: center;">
            <!-- Moon/Sun icon injected here -->
          </span>
          <span id="theme-text">Dark Mode</span>
        </button>
        <button class="btn" id="format-toggle" title="Switch 12/24 Hour Format">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" class="icon-svg">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="format-text">24H Format</span>
        </button>
      </div>

      <!-- Footer Info -->
      <footer class="footer">
        <p>&copy; <span id="year-placeholder">2026</span> Jean Chen. Crafted with care.</p>
      </footer>
    </main>
  </div>

  <!-- Client-side Logic -->
  <script>
    // Offline SVG icons represented as strings for dynamic injection
    const SVG_ICONS = {
      morning: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      afternoon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41"></path><path d="M15.98 16a6 6 0 1 0-7.96-7.96"></path><path d="M17.66 17A5 5 0 0 0 12 9a5 5 0 0 0-4.54 3H7a5 5 0 0 0 0 10h10.66a4 4 0 0 0 0-8z"></path></svg>`,
      evening: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M17 18a5 5 0 0 0-10 0"></path><line x1="12" y1="2" x2="12" y2="9"></line><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line><line x1="1" y1="18" x2="3" y2="18"></line><line x1="21" y1="18" x2="23" y2="18"></line><line x1="18.36" y1="10.22" x2="19.78" y2="11.64"></line><line x1="23" y1="22" x2="1" y2="22"></line><polyline points="16 5 12 9 8 5"></polyline></svg>`,
      night: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path><path d="M19 3v4M21 5h-4M12 2v2M14 3h-4"></path></svg>`,
      moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="icon-svg"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`
    };

    // State Variables
    let is24Hour = false;
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIconWrapper = document.getElementById('theme-icon-wrapper');
    const themeText = document.getElementById('theme-text');
    const formatToggleBtn = document.getElementById('format-toggle');
    const formatText = document.getElementById('format-text');
    const greetingIconWrapper = document.getElementById('greeting-icon-wrapper');
    const greetingLabel = document.getElementById('greeting-label');

    // Auto-detect & set current year in footer
    document.getElementById('year-placeholder').textContent = new Date().getFullYear();

    // Live Clock & Greeting Update Loop
    function updateClock() {
      const now = new Date();

      // Time calculations
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      let period = '';

      // Determine greeting and icon based on time of day
      let greeting = 'Hello';
      let greetingSvg = SVG_ICONS.morning;

      if (hours >= 5 && hours < 12) {
        greeting = 'Good Morning';
        greetingSvg = SVG_ICONS.morning;
      } else if (hours >= 12 && hours < 17) {
        greeting = 'Good Afternoon';
        greetingSvg = SVG_ICONS.afternoon;
      } else if (hours >= 17 && hours < 21) {
        greeting = 'Good Evening';
        greetingSvg = SVG_ICONS.evening;
      } else {
        greeting = 'Good Night';
        greetingSvg = SVG_ICONS.night;
      }

      // Update greeting badge
      greetingLabel.textContent = greeting;
      greetingIconWrapper.innerHTML = greetingSvg;

      // Format time based on preference
      if (!is24Hour) {
        period = hours >= 12 ? ' PM' : ' AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // convert '0' to '12'
      }

      const formattedHours = String(hours).padStart(2, '0');

      // Update DOM for time
      document.getElementById('time-hour-min').textContent = `${formattedHours}:${minutes}`;
      document.getElementById('time-sec').textContent = `:${seconds}`;

      const periodEl = document.getElementById('time-period');
      if (period) {
        periodEl.textContent = period;
        periodEl.style.display = 'inline';
      } else {
        periodEl.style.display = 'none';
      }

      // Format Date: e.g. "Friday, May 29, 2026"
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('clock-date-display').textContent = now.toLocaleDateString('en-US', options);
    }

    // Toggle 12/24 hour format
    formatToggleBtn.addEventListener('click', () => {
      is24Hour = !is24Hour;
      formatText.textContent = is24Hour ? '12H Format' : '24H Format';
      updateClock();
      clickFeedback(formatToggleBtn);
    });

    // Theme Toggle Handler
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);

      if (theme === 'light') {
        themeIconWrapper.innerHTML = SVG_ICONS.sun;
        themeText.textContent = 'Light Mode';
      } else {
        themeIconWrapper.innerHTML = SVG_ICONS.moon;
        themeText.textContent = 'Dark Mode';
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
      clickFeedback(themeToggleBtn);
    });

    // Micro-interaction Feedback helper
    function clickFeedback(element) {
      element.style.transform = 'scale(0.95)';
      setTimeout(() => {
        element.style.transform = '';
      }, 100);
    }

    // Dynamic 3D Card tilt effect on mousemove
    const card = document.getElementById('main-card');
    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return; // Disable on small devices for performance

      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - (rect.width / 2);
      const y = e.clientY - rect.top - (rect.height / 2);

      // Calculate tilt angles (restricting bounds for subtle effect)
      const tiltX = -(y / (rect.height / 2)) * 8; // Max 8 degrees
      const tiltY = (x / (rect.width / 2)) * 8;

      card.style.transform = `translateY(-4px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = 'translateY(0) rotateX(0) rotateY(0)';
    });

    // Initialize Page
    // Detect system preference or cached choice
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
      setTheme(savedTheme);
    } else {
      setTheme(prefersDark ? 'dark' : 'light');
    }

    // Run clock immediately and start interval
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>

</html>
